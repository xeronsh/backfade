[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# ThesisFactory embeds the ThesisMarket creation bytecode, so it exceeds the EIP-170
# runtime limit (27,116 B) without the optimizer. Optimize for size: it both fits the
# limit and matches the bytecode used for explorer verification.
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./"}]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]

# Richer fuzz/invariant campaigns for the hardening pass.
[profile.ci]
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
